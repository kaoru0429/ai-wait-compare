<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>這次要等多久？</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#f8fafc; --muted:#94a3b8;
      --accent:#38bdf8; --wait:#f59e0b; --out:#22c55e; --danger:#f87171; --ok:#4ade80;
      --tap:48px; --r:14px;
      font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh}
    .wrap{max-width:440px;margin:0 auto;padding:14px 14px 36px}
    h1{font-size:1.4rem;margin:8px 0 4px}
    .sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
    .banner{background:linear-gradient(135deg,#5b21b6,#7c3aed);border-radius:var(--r);padding:12px 14px;font-size:.85rem;margin-bottom:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
    .step{font-size:.75rem;color:var(--accent);font-weight:700;letter-spacing:.04em;margin-bottom:6px}
    label{display:block;font-size:.9rem;margin:10px 0 6px}
    select,textarea,input,button{width:100%;font:inherit}
    select,textarea,input{
      background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:10px;
      padding:12px;min-height:var(--tap);
    }
    textarea{min-height:120px;resize:vertical;line-height:1.45}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    button{
      border:0;border-radius:12px;min-height:var(--tap);padding:12px 14px;font-weight:700;cursor:pointer;
    }
    .primary{background:var(--accent);color:#0f172a;margin-top:12px}
    .ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:8px}
    .big{
      text-align:center;padding:18px 10px 8px;
    }
    .big .num{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
    .big .hint{color:var(--muted);margin-top:6px;font-size:.95rem}
    .bars{display:grid;gap:8px;margin-top:12px}
    .barline{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px}
    .track{height:12px;background:#0b1220;border-radius:999px;overflow:hidden;display:flex}
    .seg-w{background:var(--wait)}
    .seg-o{background:var(--out)}
    .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
    .dot-w{background:var(--wait)}.dot-o{background:var(--out)}
    .err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin-top:6px}
    .adv{margin-top:8px}
    .adv summary{color:var(--muted);cursor:pointer;font-size:.85rem;padding:8px 0}
    .model-note{color:var(--muted);font-size:.8rem;margin-top:6px}
    canvas{max-height:180px}
    .compare-title{font-size:.95rem;margin:0 0 8px}
    .token-row { display:flex; gap:8px; margin-bottom:12px; }
    .token-btn { flex:1; min-height:44px; padding:10px; background:#0b1220; border:1px solid var(--line); color:var(--muted); border-radius:10px; cursor:pointer; font-size:.9rem; font-weight:normal; }
    .token-btn.active { background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>這次要等多久？</h1>
    <p class="sub">選模型 → 貼你要問的話 → 看預估時間。不用懂 token。</p>
    <div class="banner">示範模型是<strong>虛構數字</strong>，用來理解「帳面很快」不一定比較早好。你可在下方自己改模型參數。</div>

    <div class="card">
      <div class="step">步驟 1</div>
      <label for="model">選模型</label>
      <select id="model"></select>
      <div class="model-note" id="modelNote"></div>
    </div>

    <div class="card">
      <div class="step">步驟 2</div>
      <label for="prompt">貼上你的 prompt</label>
      <textarea id="prompt" placeholder="例如：幫我寫一封給客戶的道歉信，語氣正式一點…"></textarea>
      <label>你希望它回多長（Tokens）？</label>
      <div class="token-row" id="answerLenBtns">
        <button type="button" class="token-btn active" data-val="500">500</button>
        <button type="button" class="token-btn" data-val="2000">2,000</button>
        <button type="button" class="token-btn" data-val="10000">10,000</button>
      </div>
      <div class="err" id="err"></div>
      <button class="primary" id="calcBtn" type="button">告訴我要等多久</button>
    </div>

    <div class="card" id="resultCard" hidden>
      <div class="step">結果</div>
      <div class="big">
        <div class="num" id="totalBig">—</div>
        <div class="hint" id="totalHint">從按下送出，到答案大概打完</div>
      </div>
      <div class="bars">
        <div>
          <div class="barline"><span>發呆等待（還沒開始打字）</span><strong id="waitTxt">—</strong></div>
          <div class="barline"><span>實際輸出（一個字一個字出來）</span><strong id="outTxt">—</strong></div>
        </div>
        <div class="track" id="track"><div class="seg-w" id="segW" style="width:0%"></div><div class="seg-o" id="segO" style="width:0%"></div></div>
        <div class="legend">
          <span><i class="dot dot-w"></i>等待</span>
          <span><i class="dot dot-o"></i>輸出</span>
        </div>
      </div>
      <p class="model-note" id="why"></p>
    </div>

    <div class="card" id="compareCard" hidden>
      <p class="compare-title">跟其他模型比（同樣長度）</p>
      <canvas id="chart"></canvas>
    </div>

    <details class="adv card">
      <summary>進階：自己加／改模型（可略過）</summary>
      <div class="row">
        <div>
          <label for="mName">名稱</label>
          <input id="mName" placeholder="我的模型" />
        </div>
        <div>
          <label for="mWait">開始前等待（秒）</label>
          <input id="mWait" type="number" min="0" step="0.1" placeholder="10" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="mTps">每秒大概幾個字元速度*</label>
          <input id="mTps" type="number" min="0.1" step="0.1" placeholder="40" />
        </div>
        <div>
          <label for="mTag">標記</label>
          <input id="mTag" value="自訂" />
        </div>
      </div>
      <p class="model-note">*這裡用簡化單位，對應「每秒輸出 tokens」。數字越大＝打字越快。</p>
      <button class="primary" id="addModel" type="button">加入模型</button>
      <button class="ghost" id="resetDemo" type="button">恢復虛構示範</button>
      <div id="modelList"></div>
    </details>

    <details class="adv card">
      <summary>資料匯出與匯入</summary>
      <div class="row">
        <button class="ghost" id="copyJsonBtn" type="button">複製 JSON</button>
        <button class="ghost" id="dlJsonBtn" type="button">下載 JSON</button>
      </div>
      <div style="margin-top:12px">
        <label for="importArea">貼上或選擇 JSON 檔案</label>
        <textarea id="importArea" placeholder="貼上模型的 JSON..."></textarea>
        <input type="file" id="importFile" accept=".json" style="margin-top:8px" />
      </div>
      <div class="err" id="importErr"></div>
      <div id="importSuccess" style="color:var(--ok);font-size:.85rem;margin-top:6px"></div>
      <button class="primary" id="importBtn" type="button">匯入資料</button>
    </details>
  </div>
<script>
const STORAGE_KEY = 'ai-wait-compare-v2-simple';
const DEMO = [
  { id:'d1', name:'虛構・短等待慢輸出', wait:10, tps:30, tag:'虛構範例', demo:true },
  { id:'d2', name:'虛構・中等均衡', wait:25, tps:45, tag:'虛構範例', demo:true },
  { id:'d3', name:'虛構・長等待快輸出', wait:45, tps:150, tag:'虛構範例', demo:true },
];

function uid(){ return 'm'+Math.random().toString(36).slice(2,9); }
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(DEMO);
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed)||!parsed.length) return structuredClone(DEMO);
    return parsed;
  }catch{ return structuredClone(DEMO); }
}
function save(models){ localStorage.setItem(STORAGE_KEY, JSON.stringify(models)); }

function fmtSec(s){
  if(!isFinite(s)||s<0) return '—';
  if(s<60) return (Math.round(s*10)/10)+' 秒';
  const m=Math.floor(s/60), r=Math.round(s%60);
  return m+' 分 '+(r? r+' 秒':'整');
}

function estimatePromptBoost(_text){
  // removed: must not alter formula total = wait + tokens/tps
  return 0;
}

let models = load();
let chart;
let currentAnswerLen = 500;

const $ = (id)=>document.getElementById(id);
function refreshSelect(){
  const sel=$('model');
  const cur=sel.value;
  sel.innerHTML='';
  models.forEach(m=>{
    const opt=document.createElement('option');
    opt.value=m.id;
    opt.textContent=m.demo? `${m.name}（虛構）` : m.name;
    sel.appendChild(opt);
  });
  if(models.some(m=>m.id===cur)) sel.value=cur;
  updateModelNote();
  renderModelList();
}
function currentModel(){ return models.find(m=>m.id===$('model').value) || models[0]; }
function updateModelNote(){
  const m=currentModel();
  if(!m){$('modelNote').textContent='';return;}
  $('modelNote').textContent=`這個模型設定：先發呆約 ${fmtSec(m.wait)}，之後大約每秒輸出 ${m.tps} 單位。`;
}

function calcOne(m, answerTokens, promptText){
  const wait = Number(m.wait);
  const out = answerTokens / Number(m.tps);
  return { wait, out, total: wait+out };
}

function calc(){
  $('err').textContent='';
  const m=currentModel();
  const prompt=$('prompt').value;
  const answerTokens=currentAnswerLen;
  if(!m){$('err').textContent='請先選模型';return;}
  if(!prompt.trim()){$('err').textContent='先貼一下你要問的話（可很短）';return;}
  if(!(m.tps>0)){$('err').textContent='這個模型的速度設定有問題，請到進階修正';return;}

  const r=calcOne(m, answerTokens, prompt);
  $('resultCard').hidden=false;
  $('compareCard').hidden=false;
  $('totalBig').textContent='大約 '+fmtSec(r.total);
  $('waitTxt').textContent=fmtSec(r.wait);
  $('outTxt').textContent=fmtSec(r.out);
  const sum=r.total||1;
  $('segW').style.width=(r.wait/sum*100)+'%';
  $('segO').style.width=(r.out/sum*100)+'%';

  // 一眼看懂為什麼快不一定早完成
  const others=models.map(x=>({m:x, ...calcOne(x, answerTokens, prompt)})).sort((a,b)=>a.total-b.total);
  const rank=others.findIndex(x=>x.m.id===m.id)+1;
  const fastest=others[0];
  let why=`你選的排第 ${rank} 名（共 ${others.length} 個）。`;
  if(m.id!==fastest.m.id){
    why += ` 帳面打字最快的不一定最早好：像「長等待快輸出」常常先發呆很久。這次最快的是「${fastest.m.name}」（約 ${fmtSec(fastest.total)}）。`;
  }else{
    why += ` 這次它綜合最早完成。`;
  }
  
  $('why').textContent=why;
  drawChart(others);
}

function drawChart(rows){
  const labels=rows.map(r=>r.m.name.replace('虛構・',''));
  const waits=rows.map(r=>+r.wait.toFixed(1));
  const outs=rows.map(r=>+r.out.toFixed(1));
  const ctx=$('chart');
  if(chart) chart.destroy();
  chart=new Chart(ctx,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'發呆等待', data:waits, backgroundColor:'#f59e0b', stack:'t'},
        {label:'實際輸出', data:outs, backgroundColor:'#22c55e', stack:'t'},
      ]
    },
    options:{
      indexAxis:'y',
      responsive:true,
      plugins:{legend:{labels:{color:'#cbd5e1'}}},
      scales:{
        x:{stacked:true, ticks:{color:'#94a3b8'}, grid:{color:'#334155'}, title:{display:true,text:'秒',color:'#94a3b8'}},
        y:{stacked:true, ticks:{color:'#e2e8f0'}, grid:{display:false}}
      }
    }
  });
}

function renderModelList(){
  const box=$('modelList');
  box.innerHTML='';
  models.forEach(m=>{
    const div=document.createElement('div');
    div.style.cssText='border-top:1px solid #334155;padding:10px 0;font-size:.85rem';
    div.innerHTML=`<strong>${m.name}</strong> · 等待 ${m.wait}s · 速度 ${m.tps}`+
      (m.demo?' · 虛構':'')+
      ` <button type="button" data-del="${m.id}" style="margin-top:6px;width:auto;padding:6px 10px;background:#7f1d1d;color:#fff;border:0;border-radius:8px">刪除</button>`;
    box.appendChild(div);
  });
  box.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick=()=>{
      models=models.filter(x=>x.id!==btn.dataset.del);
      if(!models.length) models=structuredClone(DEMO);
      save(models); refreshSelect();
    };
  });
}

$('model').onchange=()=>{ updateModelNote(); if(!$('resultCard').hidden) calc(); };
$('calcBtn').onclick=calc;

$('addModel').onclick=()=>{
  const name=$('mName').value.trim();
  const wait=Number($('mWait').value);
  const tps=Number($('mTps').value);
  if(!name||!(wait>=0)||!(tps>0)){$('err').textContent='進階：名稱、等待、速度都要填對';return;}
  models.push({id:uid(), name, wait, tps, tag:$('mTag').value||'自訂', demo:false});
  save(models); refreshSelect();
  $('mName').value='';$('mWait').value='';$('mTps').value='';
};
$('resetDemo').onclick=()=>{ models=structuredClone(DEMO); save(models); refreshSelect(); };

document.querySelectorAll('.token-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.token-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentAnswerLen = Number(btn.dataset.val);
    if(!$('resultCard').hidden) {
      calc();
    }
  };
});

$('copyJsonBtn').onclick = () => {
  $('importErr').textContent = '';
  $('importSuccess').textContent = '';
  const jsonStr = JSON.stringify(models, null, 2);
  navigator.clipboard.writeText(jsonStr)
    .then(() => { $('importSuccess').textContent = '已複製 JSON 到剪貼簿。'; })
    .catch(() => { $('importErr').textContent = '複製失敗，請手動選取並複製。'; });
};

$('dlJsonBtn').onclick = () => {
  $('importErr').textContent = '';
  $('importSuccess').textContent = '';
  const jsonStr = JSON.stringify(models, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ai-wait-models.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  $('importSuccess').textContent = '已下載 JSON 檔案。';
};

$('importFile').onchange = (e) => {
  $('importErr').textContent = '';
  $('importSuccess').textContent = '';
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    $('importArea').value = evt.target.result;
  };
  reader.readAsText(file);
};

$('importBtn').onclick = () => {
  $('importErr').textContent = '';
  $('importSuccess').textContent = '';
  const raw = $('importArea').value.trim();
  if (!raw) {
    $('importErr').textContent = '請先貼上 JSON 或選擇檔案。';
    return;
  }
  try {
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) {
      throw new Error('匯入資料必須是陣列格式');
    }
    const newModels = parsed.map(m => {
      if (typeof m.name !== 'string' || !m.name.trim()) throw new Error('匯入失敗：缺少有效的 name');
      if (typeof m.wait !== 'number' || m.wait < 0) throw new Error(`匯入失敗：模型 "${m.name}" 的 wait 必須是大於等於 0 的數字`);
      if (typeof m.tps !== 'number' || m.tps <= 0) throw new Error(`匯入失敗：模型 "${m.name}" 的 tps 必須是大於 0 的數字`);
      
      return {
        id: m.id || uid(),
        name: m.name.trim(),
        wait: m.wait,
        tps: m.tps,
        tag: m.tag || '匯入',
        demo: !!m.demo
      };
    });
    
    models = newModels;
    save(models);
    refreshSelect();
    $('importSuccess').textContent = `成功匯入 ${models.length} 個模型。`;
    $('importArea').value = '';
    $('importFile').value = '';
  } catch (err) {
    $('importErr').textContent = err.message || '匯入失敗：格式不正確，請確認是有效的 JSON。';
  }
};

refreshSelect();
</script>
</body>
</html>
